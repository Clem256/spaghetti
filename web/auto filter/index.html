<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<input id="myInput" type="text" placeholder="Search..">
<br><br>
<body>
  <table>
    <thead>
    <tr>
      <th>First name</th>
      <th>Last Name</th>
      <th>Email</th>
    </tr>
    </thead>
    <tbody id="myTable">
    <tr>
      <td>Titus</td>
      <td>Demetrian</td>
      <td>t</td>
    </tr>
    <tr>
      <td>Roboute</td>
      <td>Guilliman</td>
      <td>r</td>
    </tr>
    <tr>
      <td>Vulkan</td>
      <td>Salamenders</td>
      <td>s</td>
    </tr>
    </tbody>
  </table>
</body>
</html>
<script>
  $(document).ready(function (){
    $("#myInput").on("keyup", function (){
      let value = $(this).val().toLowerCase();
      $("#myTable tr").filter(function (){
        $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
      });
    });
  });
</script>
